<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">×</span><span>TIC<br><i>TAC TOE</i></span></div><div class="round-label"><span class="live-dot"></span> LOCAL MATCH</div></header><section class="hero"><div><p class="eyebrow">THE CLASSIC GAME</p><h1>Tic Tac<br><em>Toe.</em></h1></div><p class="intro">Three in a row wins.<br>Choose your squares wisely.</p></section><section class="game-card"><div class="game-head"><div class="status"><span class="turn-symbol" id="turn-symbol">X</span><span id="status-text">PLAYER 1'S TURN</span></div><button class="reset-small" id="reset-round">RESET ROUND <span>↻</span></button></div><div class="board" id="board" role="grid"><button class="cell" data-index="0"></button><button class="cell" data-index="1"></button><button class="cell" data-index="2"></button><button class="cell" data-index="3"></button><button class="cell" data-index="4"></button><button class="cell" data-index="5"></button><button class="cell" data-index="6"></button><button class="cell" data-index="7"></button><button class="cell" data-index="8"></button></div><div class="game-foot"><span>FIRST TO THREE</span><span id="round-count">ROUND 01</span></div></section><section class="scoreboard"><div class="score player-x"><span class="score-letter" id="player-one-symbol">X</span><div><span class="score-name">PLAYER ONE</span><strong id="score-one">0</strong></div></div><div class="score-divider">VS</div><div class="score player-o"><div><span class="score-name">PLAYER TWO</span><strong id="score-two">0</strong></div><span class="score-letter" id="player-two-symbol">O</span></div></section><button class="new-game" id="new-game">NEW GAME <span>→</span></button><footer>TAKE TURNS · HAVE FUN · PLAY AGAIN</footer></main><script src="script.js"></script></body></html>
<section class="start-screen" id="start-screen"><div class="start-panel"><p class="eyebrow">INSERT COINS · PLAYER SETUP</p><h2>WHO'S<br><em>PLAYING?</em></h2><div class="name-fields"><label>PLAYER ONE <input id="player-one-name" maxlength="14" placeholder="PLAYER ONE"></label><label>PLAYER TWO <input id="player-two-name" maxlength="14" placeholder="PLAYER TWO"></label></div><div class="coin" id="coin">?</div><p class="coin-result" id="coin-result">FLIP TO CHOOSE WHO GOES FIRST</p><button class="start-button" id="start-game">FLIP COIN &amp; START</button></div></section>
